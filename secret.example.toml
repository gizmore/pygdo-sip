[sip]
serv_url = "speedport.ip"
# Authentication name supplied by the provider/router.
serv_username = ""
serv_password = ""
serv_transport = "TCP"
# Optional SIP identity. Speedport IP telephones use their internal number
# here (for example **71), which may differ from the authentication name.
serv_identity = ""
# Router-required minimum registration interval, in seconds.
serv_register_duration = "300"
